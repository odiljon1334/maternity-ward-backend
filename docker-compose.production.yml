# ============================================================
# Production Docker Compose — Maternity Ward
# Ishlatish: bash deploy.sh
#
# Ko'p container (horizontal scaling):
#   docker compose -f docker-compose.production.yml up -d --scale backend=4
#   (Nginx upstream service DNS orqali barchasini topadi)
# ============================================================

version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maternity_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maternity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maternity_ward_db}
    # Performance tuning (32-core server uchun)
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c max_worker_processes=16
      -c max_parallel_workers_per_gather=8
      -c max_parallel_workers=16
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maternity_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maternity_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '8.0'
        reservations:
          memory: 2G
          cpus: '2.0'

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maternity_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - maternity_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'

  # ── Backend (NestJS) ───────────────────────────────────────
  # Scaling: docker compose up -d --scale backend=4
  # (container_name olib tashlangan — scaling uchun)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 5001
      TZ: Asia/Tashkent
      # Har bir container 4GB Node heap oladi
      NODE_MEMORY_MB: 4096
      # DB connection pool: instances × connection_limit ≤ max_connections(200)
      # 4 instance × 20 = 80 ≤ 200 ✓
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-maternity_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maternity_ward_db}?connection_limit=20&pool_timeout=30
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maternity_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      # Replikalar: docker compose up --scale backend=4 yoki bu yerda:
      replicas: 2
      resources:
        limits:
          memory: 5G
          cpus: '4.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ../maternity-ward-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: maternity_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-info@maternity.uz}
      NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maternity_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  # ── MediaMTX (RTSP → HLS relay) ───────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: maternity_mediamtx
    restart: always
    environment:
      MTX_PROTOCOLS: tcp
      MTX_HLSADDRESS: :8888
      MTX_RTSPADDRESS: :8554
      MTX_RTMPADDRESS: :1935
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSSEGMENTCOUNT: "3"
      MTX_HLSSEGMENTDURATION: "1s"
    ports:
      - "8554:8554"
      - "1935:1935"
    networks:
      - maternity_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ── Nginx (reverse proxy + SSL) ────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: maternity_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - maternity_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '1.0'

networks:
  maternity_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_webroot:
