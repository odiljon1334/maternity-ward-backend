# ============================================================
# Production Docker Compose — Maternity Ward
# Ishlatish: bash deploy.sh
# ============================================================

version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maternity_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maternity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maternity_ward_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maternity_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maternity_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maternity_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - maternity_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'

  # ── Backend (NestJS) ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maternity_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 5001
      TZ: Asia/Tashkent
      DATABASE_URL: postgresql://${POSTGRES_USER:-maternity_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maternity_ward_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maternity_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ../maternity-ward-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: maternity_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-info@maternity.uz}
      NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maternity_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  # ── MediaMTX (RTSP → HLS relay) ───────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: maternity_mediamtx
    restart: always
    environment:
      MTX_PROTOCOLS: tcp
      MTX_HLSADDRESS: :8888
      MTX_RTSPADDRESS: :8554
      MTX_RTMPADDRESS: :1935
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSSEGMENTCOUNT: "3"
      MTX_HLSSEGMENTDURATION: "1s"
    ports:
      - "8554:8554"   # RTSP — Hikvision kamera ulanadi
      - "1935:1935"   # RTMP
    networks:
      - maternity_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Nginx (reverse proxy + SSL) ────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: maternity_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - maternity_net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

networks:
  maternity_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_webroot:
