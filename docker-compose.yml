version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maternity_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maternity_ward_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maternity_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-maternity_ward_db}
      PORT: 5001
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5001:5001"

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ../maternity-ward-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://yourdomain.com/api/v1}
    container_name: maternity_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5000:5000"

  # ── MediaMTX (RTSP relay + HLS server) ─────────────────────────────────────
  # Har bir poliklinikadagi FFmpeg agent shu portga push qiladi:
  #   ffmpeg -i rtsp://... -f rtsp rtsp://vps-ip:8554/hospital1/cam1
  # Browser HLS orqali ko'radi:
  #   https://yourdomain.com/live/hospital1/cam1/index.m3u8
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: maternity_mediamtx
    restart: unless-stopped
    environment:
      # HLS — browser uchun
      MTX_HLSADDRESS:        :8888
      MTX_HLSALWAYSREMUX:    "yes"
      MTX_HLSSEGMENTCOUNT:   "3"
      MTX_HLSSEGMENTDURATION: "2s"

      # RTSP — FFmpeg agent push uchun
      MTX_RTSPADDRESS:       :8554

      # Authentication (ixtiyoriy, tavsiya etiladi)
      # MTX_AUTHMETHOD: http
      # MTX_AUTHINTERNALUSERS: ...
    ports:
      - "8554:8554"   # RTSP in  (FFmpeg agent shu portga push qiladi)
      - "8888:8888"   # HLS  out (Nginx orqali ochiladi)
    volumes:
      - mediamtx_data:/mediamtx

  # ── Nginx (reverse proxy + SSL) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: maternity_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - mediamtx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads_data:/var/www/uploads:ro

volumes:
  postgres_data:
  uploads_data:
  mediamtx_data:
