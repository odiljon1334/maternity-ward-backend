        listen 443 ssl http2;
        server_name api.clinicuk24.com;

        ssl_certificate     /etc/letsencrypt/live/clinicuk24.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clinicuk24.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        client_max_body_size 25M;

        # ── Telegram webhook ──────────────────────────────────
        location = /api/telegram/webhook {
