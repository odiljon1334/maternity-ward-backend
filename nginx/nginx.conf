        }

        # ── Uploads ───────────────────────────────────────────
        location /uploads/ {
            proxy_pass http://backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── WebSocket ─────────────────────────────────────────
        location /ws/ {
