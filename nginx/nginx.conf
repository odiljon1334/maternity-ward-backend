# ============================================================
# Nginx — Maternity Ward (HTTP + HTTPS)
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Buffer sizes
    client_body_buffer_size     128k;
    client_max_body_size        25M;
    proxy_buffer_size           16k;
    proxy_buffers               8 16k;
    proxy_busy_buffers_size     32k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Real IP (Cloudflare orqali kelsa) ─────────────────────
    # Cloudflare IP ranglar — real client IP ni olish uchun
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Rate limiting zones ───────────────────────────────────
    # Login — juda qattiq (brute force himoya)
    limit_req_zone $binary_remote_addr zone=login:10m     rate=5r/m;

    # General API — oddiy so'rovlar
    limit_req_zone $binary_remote_addr zone=api:10m       rate=30r/s;

    # Heavy API — employee qo'shish, schedule, upload (ko'p action)
    limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=10r/s;

    # ── Docker DNS resolver ───────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Upstreams ─────────────────────────────────────────────
    upstream backend  { ip_hash; server backend:5001;              keepalive 64; }
    upstream frontend {          server maternity_frontend:5000;   keepalive 16; }
    upstream mediamtx {          server maternity_mediamtx:8888;   keepalive 8;  }

    # ── HTTP: domain → HTTPS redirect ────────────────────────
    server {
        listen 80;
        server_name clinicuk24.com www.clinicuk24.com api.clinicuk24.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTP: IP orqali kirish (Hikvision terminal) ───────────
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 25M;

        # Xavfli fayllarni bloklash
        location ~* \.(env|log|sql|bak|yml|yaml|ini|pem|key|config|git)$ { return 404; }
        location ~ /\.                                                      { return 404; }

        # ── Hikvision terminal webhook — rate limit YO'Q ─────
        # TODO: keyinroq ?token=xxx qo'shish
        location /hikvision/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 25M;
        }

        # ── Telegram webhook — rate limit YO'Q ───────────────
        # Telegram serverlaridan keladi (149.154.x.x, 91.108.x.x)
        location = /api/telegram/webhook {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # ── Auth login — qattiq limit ─────────────────────────
        location = /api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Employee/schedule/upload — heavy zone ─────────────
        location ~* ^/api/v1/(employees|schedules|departments|positions|hospitals|leave|payroll) {
            limit_req zone=api_heavy burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            client_max_body_size 25M;
        }

        # ── AI Agent (SSE streaming) ──────────────────────────
        location = /api/agent {
            proxy_pass http://frontend/api/agent;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 600s;
        }

        # ── General API ───────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Uploads (static files) ────────────────────────────
        location /uploads/ {
            proxy_pass http://backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── WebSocket ─────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ── Socket.IO ─────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        # ── MediaMTX (RTSP/HLS) ──────────────────────────────
        location /live/ {
            proxy_pass http://mediamtx/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store";
            add_header Access-Control-Allow-Origin "*";
        }

        # ── Frontend (Next.js) ────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── HTTPS: clinicuk24.com ─────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name clinicuk24.com www.clinicuk24.com;

        ssl_certificate     /etc/letsencrypt/live/clinicuk24.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clinicuk24.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        client_max_body_size 25M;

        location ~* \.(env|log|sql|bak|yml|yaml|ini|pem|key|config|git)$ { return 404; }
        location ~ /\. { return 404; }

        # ── Telegram webhook ──────────────────────────────────
        location = /api/telegram/webhook {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # ── Auth login ────────────────────────────────────────
